<!doctype html>

    <!-- SEO Meta Tags -->

    <!--

      ──────────────────────────────────────────────────────────────────────

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Dancing+Script:wght@700&family=Inter:wght@400;500;600&display=swap"

    />
